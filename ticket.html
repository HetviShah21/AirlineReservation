<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flight Ticket</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .ticket {
      background: #fff;
      border-radius: 20px;
      width: 380px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .ticket-header {
      background: #4a90e2;
      color: #fff;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .ticket-body {
      padding: 20px;
    }
    .ticket-info {
      margin-bottom: 15px;
    }
    .label {
      font-weight: 600;
      color: #888;
      font-size: 12px;
      text-transform: uppercase;
    }
    .value {
      font-size: 16px;
      font-weight: bold;
      color: #333;
    }
    .divider {
      border-top: 1px dashed #ccc;
      margin: 20px 0;
    }
    .ticket-footer {
      background: #f9f9f9;
      text-align: center;
      padding: 15px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>

<div class="ticket">
  <div class="ticket-header">
    ✈️ SkyWings Airlines
  </div>
  <div class="ticket-body">
    <div class="ticket-info">
      <div class="label">Passenger</div>
      <div class="value">John Doe</div>
    </div>
    <div class="ticket-info">
      <div class="label">Flight</div>
      <div class="value">AB1234</div>
    </div>
    <div class="ticket-info">
      <div class="label">From</div>
      <div class="value">New York (JFK)</div>
    </div>
    <div class="ticket-info">
      <div class="label">To</div>
      <div class="value">London (LHR)</div>
    </div>
    <div class="ticket-info">
      <div class="label">Departure</div>
      <div class="value">April 30, 2025 - 10:00 AM</div>
    </div>
    <div class="ticket-info">
      <div class="label">Arrival</div>
      <div class="value">April 30, 2025 - 10:00 PM</div>
    </div>
    <div class="ticket-info">
      <div class="label">Seat</div>
      <div class="value">12A (Economy)</div>
    </div>
    <div class="ticket-info">
      <div class="label">Booking Ref</div>
      <div class="value">XYZ789</div>
    </div>
    <div class="divider"></div>
    <div class="ticket-footer">
      Thank you for flying with us! Safe journey. 🌎
    </div>
  </div>
</div>

</body>
</html>
